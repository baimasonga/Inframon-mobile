name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Reconstruct env.json from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repo secrets SUPABASE_URL and/or SUPABASE_ANON_KEY. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip any whitespace / control chars that may have been pasted into
          # the secret value (very easy to copy a stray \n from a doc). JWTs and
          # Supabase URLs never contain whitespace, so this is safe.
          clean_url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          clean_key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          # Build the JSON with jq so escaping is correct and control chars in
          # the values (if any survived) become \uXXXX rather than literal bytes.
          jq -n \
            --arg url "$clean_url" \
            --arg key "$clean_key" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json
          # Sanity: confirm file is valid JSON without leaking values.
          python3 -c "import json; json.load(open('env.json'))"
          echo "env.json written ($(wc -c < env.json) bytes)"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APKs (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define-from-file=env.json

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inframon-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── Firebase App Distribution ──────────────────────────────────────────
      # Only fires on push to main and manual dispatch — feature branches and
      # PRs build and produce artifacts but do NOT notify testers. Requires
      # three repo secrets:
      #   FIREBASE_APP_ID                — Android App ID from Firebase console
      #   FIREBASE_SERVICE_ACCOUNT_JSON  — full JSON of a service-account key
      #                                    with the "Firebase App Distribution
      #                                    Admin" role
      #   FIREBASE_TESTER_GROUPS         — comma-separated tester group aliases
      - name: Distribute to Firebase App Distribution
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
